# Runs the Section 8 quality gate on every commit. Hooks use the project's venv
# tools via PATH (`language: system`), so commit with the venv activated.
# Setup once per clone: `pre-commit install`.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format --check
        entry: ruff format --check
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: system
        types: [python]
      - id: mypy
        name: mypy (strict)
        entry: mypy .
        language: system
        pass_filenames: false
        types: [python]
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        pass_filenames: false
        types: [python]
      - id: detect-secrets
        name: detect-secrets
        entry: detect-secrets-hook --baseline .secrets.baseline
        language: system
